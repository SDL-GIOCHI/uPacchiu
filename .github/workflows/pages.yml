name: Deploy sito (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Imposta web/config.js (con controllo delle variabili)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          # ripulisce spazi, ritorni a capo, virgolette e "/" finale
          URL=$(printf '%s' "$SUPABASE_URL" | tr -d ' \r\n"'"'"'' | sed 's#/*$##')
          KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d ' \r\n"'"'"'')
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/app_settings?id=eq.1&select=id" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || true)
            if [ "$code" = "200" ]; then
              printf 'window.LENTINIA_CONFIG={SUPABASE_URL:%s,SUPABASE_ANON_KEY:%s,EMAIL_DOMAIN:"lentinia.app"};\n' \
                "$(jq -Rn --arg v "$URL" '$v')" "$(jq -Rn --arg v "$KEY" '$v')" > web/config.js
              echo "config.js generato dalle variabili (controllo OK)"
            else
              echo "::warning::Le variabili SUPABASE_URL / SUPABASE_ANON_KEY NON funzionano (HTTP $code): uso i valori già presenti in web/config.js. Correggi le variabili in Settings > Secrets and variables > Actions > Variables."
            fi
          else
            echo "::warning::Variabili SUPABASE_URL / SUPABASE_ANON_KEY non impostate: uso i valori già presenti in web/config.js."
          fi
          echo "Server configurato nel sito:"; grep -o 'SUPABASE_URL:"[^"]*"' web/config.js || grep -o 'SUPABASE_URL: "[^"]*"' web/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: dep
        uses: actions/deploy-pages@v4

name: Build APK Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Installa dipendenze
        run: npm install --no-audit --no-fund

      - name: Genera capacitor.config.json (URL del sito)
        env:
          APP_URL: ${{ vars.APP_URL }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$APP_URL" ]; then
            OWNER="${REPO%%/*}"; NAME="${REPO##*/}"
            APP_URL="https://${OWNER,,}.github.io/${NAME}/"
          fi
          echo "APP_URL=$APP_URL"
          APP_URL="$APP_URL" node scripts/make-config.js

      - name: Crea progetto Android, applica schermo intero e icona
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          npx cap add android
          bash scripts/patch-android.sh
          bash scripts/make-icon.sh
          npx cap sync android

      - name: Compila (e firma, se è presente il keystore)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            ./gradlew assembleRelease --no-daemon
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            KEY_PASS="${KEY_PASS:-$KS_PASS}" "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" \
              --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
              --out ../Pokedex-Lentinia.apk "$RUNNER_TEMP/aligned.apk"
          else
            echo "::warning::Keystore non impostato: APK di debug (la firma cambia a ogni build, quindi per aggiornare va disinstallata la versione precedente)."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Pokedex-Lentinia.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Pokedex-Lentinia-apk
          path: Pokedex-Lentinia.apk

      - name: Allega l'APK alla release (solo per i tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Pokedex-Lentinia.apk

name: Keep-alive Supabase

# I progetti Supabase gratuiti vengono messi in pausa dopo ~7 giorni senza attività.
# Questo workflow fa una richiesta al database ogni giorno, così il progetto resta sempre attivo.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Richiesta al database
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/app_settings?id=eq.1&select=id" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"; cat /tmp/out.json; echo
          [ "$code" = "200" ]

      # GitHub disattiva i workflow pianificati dopo 60 giorni senza attività nel repository.
      # Se l'ultimo commit è vecchio di oltre 45 giorni ne facciamo uno vuoto.
      - name: Mantieni attivo il repository
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name  "keepalive[bot]"
            git config user.email "keepalive[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep-alive"
            git push
          fi
